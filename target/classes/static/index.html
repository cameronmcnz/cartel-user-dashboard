<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartel Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #101820;
            color: #f5f7fa;
        }
        .card {
            width: min(420px, calc(100% - 32px));
            padding: 28px;
            border-radius: 14px;
            background: #182532;
            border: 1px solid #31465a;
        }
        h1 { margin-top: 0; }
        label { display: block; margin: 14px 0 6px; }
        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #536b80;
            border-radius: 7px;
            background: #0f1923;
            color: white;
        }
        button {
            width: 100%;
            margin-top: 18px;
            padding: 11px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }
        #message { min-height: 24px; margin-top: 14px; line-height: 1.4; }
        #message.error { color: #ff9c9c; }
        #message.info { color: #ffe082; }
        .help { color: #aab8c5; font-size: 13px; line-height: 1.45; }
    </style>
</head>
<body>

<div class="card">
    <h1>Cartel Control</h1>
    <p class="help">
        Login is handled by the auth server on port 3000. This page stores the returned JWT in sessionStorage and the
        Cartel page sends it as a Bearer token when calling the protected API.
    </p>

    <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" name="username" value="marcus" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" value="abc123" required>

        <button type="submit">Login</button>
    </form>

    <div id="message"></div>
</div>

<script>
    const AUTH_URL = "http://localhost:3000/auth/login";
    const TOKEN_KEY = "cartelAccessToken";
    const message = document.getElementById("message");

    function showErrorFromUrl() {
        const error = new URLSearchParams(window.location.search).get("error");

        if (!error) {
            return;
        }

        const messages = {
            "missing-token": "Please log in before accessing Cartel data.",
            "unauthorized": "Your JWT is missing, invalid, or expired. Please log in again.",
            "forbidden": "Your account is authenticated but is not allowed to access Cartel data.",
            "api-error": "The Cartel API returned an unexpected error.",
            "network-error": "The Cartel API could not be reached."
        };

        message.className = "info";
        message.textContent = messages[error] || "Access to the Cartel API failed.";

        history.replaceState(null, "", "/index.html");
    }

    async function readError(response) {
        const text = (await response.text()).trim();

        try {
            const json = JSON.parse(text);
            return json.detail || json.message || text;
        } catch {
            return text || response.statusText || "Request failed";
        }
    }

    showErrorFromUrl();

    document.getElementById("loginForm").addEventListener("submit", async event => {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        message.className = "";
        message.textContent = "Logging in...";

        try {
            const body = new URLSearchParams({ username, password });

            const response = await fetch(AUTH_URL, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body
            });

            if (!response.ok) {
                throw new Error(await readError(response));
            }

            const token = (await response.text()).trim();

            if (!token) {
                throw new Error("The auth server returned an empty token.");
            }

            sessionStorage.setItem(TOKEN_KEY, token);
            window.location.href = "/cartel/index.html";

        } catch (error) {
            sessionStorage.removeItem(TOKEN_KEY);
            message.className = "error";
            message.textContent = "Login failed: " + error.message;
        }
    });
</script>

</body>
</html>
